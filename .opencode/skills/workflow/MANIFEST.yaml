    - name: next
      version: "15.x"
      purpose: "Framework fullstack"
    - name: react
      version: "19.x"
      purpose: "UI library"
    - name: typescript
      version: "5.x"
      purpose: "Type system"
    - name: next-sanity
      version: latest
      purpose: "Sanity + Next.js integration"
    - name: "@sanity/client"
      version: latest
      purpose: "Sanity API client"
    - name: "@sanity/image-url"
      version: latest
      purpose: "Optimized image URL generation"
    - name: "@sanity/vision"
      version: latest
      purpose: "GROQ query playground"
    - name: "@portabletext/react"
      version: latest
      purpose: "Safe rich text rendering"
    - name: next-intl
      version: latest
      purpose: "Internationalization (4 locale)"
    - name: tailwindcss
      version: "4.x"
      purpose: "Utility CSS"
    - name: "@tailwindcss/postcss"
      version: latest
      purpose: "PostCSS integration"
    - name: tailwind-merge
      version: latest
      purpose: "Class utilities"
    - name: clsx
      version: latest
      purpose: "Class utilities"
    - name: class-variance-authority
      version: latest
      purpose: "Variant components"
    - name: tailwindcss-animate
      version: latest
      purpose: "CSS animations"
    - name: lucide-react
      version: latest
      purpose: "Icon set"
    - name: "@radix-ui/react-slot"
      version: latest
      purpose: "Button asChild"
    - name: "@radix-ui/react-dialog"
      version: latest
      purpose: "Sheet (mobile nav)"
    - name: "@radix-ui/react-navigation-menu"
      version: latest
      purpose: "Desktop nav"
    - name: "@radix-ui/react-dropdown-menu"
      version: latest
      purpose: "Language switcher"
    - name: "@radix-ui/react-separator"
      version: latest
      purpose: "Section divider"
    - name: "@radix-ui/react-avatar"
      version: latest
      purpose: "Member photos"
    - name: "@radix-ui/react-aspect-ratio"
      version: latest
      purpose: "Consistent image containers"
    - name: zod
      version: latest
      purpose: "Schema validation"
    - name: react-hook-form
      version: latest
      purpose: "Form state management"
    - name: "@hookform/resolvers"
      version: latest
      purpose: "Form resolvers"
    - name: resend
      version: latest
      purpose: "Email delivery (newsletter)"
    - name: "@supabase/supabase-js"
      version: latest
      purpose: "Subscriber data store"
    - name: "@vercel/analytics"
      version: latest
      purpose: "Page views + Web Vitals"
    - name: "@sentry/nextjs"
      version: latest
      purpose: "Error monitoring"
    - name: gsap
      version: "3.12.5"
      purpose: "Animation"

  dev:
    - name: eslint
      version: latest
      purpose: "Linting"
    - name: "eslint-config-next"
      version: latest
      purpose: "Next.js lint rules"
    - name: prettier
      version: latest
      purpose: "Code formatting"
    - name: postcss
      version: latest
      purpose: "CSS processing"
    - name: vitest
      version: latest
      purpose: "Unit + integration testing"
    - name: "@types/node"
      version: latest
      purpose: "Node.js types"
    - name: "@types/react"
      version: latest
      purpose: "React types"

# ==========================================================================
# 7. SANITY SCHEMA MAP (from PRD §5.4)
# ==========================================================================
sanity_schemas:
  - name: member
    description: "25 Kelompok Perhutanan Sosial"
    file: "sanity/schema/member.ts"
    locale_fields: [deskripsi]

  - name: product
    description: "Katalog HHBK"
    file: "sanity/schema/product.ts"
    locale_fields: [deskripsi, cerita, kutipan]

  - name: story
    description: "Cerita Storytelling"
    file: "sanity/schema/story.ts"
    locale_fields: [judul, narasi, kutipan]

  - name: activity
    description: "Berita & Kegiatan"
    file: "sanity/schema/activity.ts"
    locale_fields: [judul, konten]

  - name: siteSettings
    description: "Singleton — Pengaturan Website"
    file: "sanity/schema/siteSettings.ts"
    locale_fields: [heroTitle, heroSubtitle, aboutContent, visi, misi]

# ==========================================================================
# 8. ROUTE MAP (from PRD §3.1)
# ==========================================================================
routes:
  - path: "/[locale]"
    page: "Beranda"
    rendering: "ISR"
    revalidation: 60
    file: "app/[locale]/page.tsx"

  - path: "/[locale]/tentang"
    page: "Tentang"
    rendering: "ISR"
    revalidation: 60

  - path: "/[locale]/kelompok"
    page: "Daftar Kelompok"
    rendering: "ISR"
    revalidation: 60

  - path: "/[locale]/kelompok/[slug]"
    page: "Detail Kelompok"
    rendering: "SSG"
    revalidation: "on-demand"

  - path: "/[locale]/produk"
    page: "Katalog Produk"
    rendering: "ISR"
    revalidation: 60

  - path: "/[locale]/produk/[slug]"
    page: "Detail Produk"
    rendering: "SSG"
    revalidation: "on-demand"

  - path: "/[locale]/cerita"
    page: "Semua Cerita"
    rendering: "ISR"
    revalidation: 60

  - path: "/[locale]/cerita/[slug]"
    page: "Detail Cerita"
    rendering: "SSG"
    revalidation: "on-demand"

  - path: "/[locale]/kegiatan"
    page: "Berita & Kegiatan"
    rendering: "ISR"
    revalidation: 60

  - path: "/[locale]/kegiatan/[slug]"
    page: "Detail Kegiatan"
    rendering: "SSG"
    revalidation: "on-demand"

  - path: "/[locale]/mitra"
    page: "Mitra Strategis"
    rendering: "ISR"
    revalidation: 60

  - path: "/[locale]/kontak"
    page: "Form Kontak"
    rendering: "Static"
    revalidation: null

  - path: "/studio/[[...index]]"
    page: "Sanity Studio"
    rendering: "CSR"
    revalidation: null

# ==========================================================================
# 9. DEFINITION OF DONE CHECKLIST (from PRD §15)
# ==========================================================================
definition_of_done:
  fungsional:
    - "Semua 13 halaman publik render dengan benar di 4 locale"
    - "Sanity Studio bisa login & CRUD semua content type"
    - "Revalidasi ISR jalan via Sanity webhook"
    - "Form kontak terkirim ke email koperasi"
    - "Newsletter subscribe → simpan di Supabase + kirim welcome email via Resend"

  storytelling:
    - "Setiap produk punya cerita asal minimal 2 paragraf"
    - "Setiap kelompok punya narasi profil minimal 3 paragraf"
    - "Minimal 3 spotlight cerita anggota"
    - "Halaman Tentang pakai narasi + timeline, bukan bullet point"
    - "Hero homepage punya hook emosional"
    - "Minimal 1 kutipan/testimoni"
    - "Foto di website menampilkan manusia + konteks"

  teknis:
    - "Lighthouse score ≥ 90 di 4 kategori"
    - "Mobile responsive (semua halaman)"
    - "CSP header aktif"
    - "Vercel Analytics tracking"
    - "Metadata SEO + sitemap + robots.txt + structured data"
    - "Language switcher berfungsi di semua halaman"
    - "Deploy di Vercel"

  keamanan:
    - "Semua rich text dirender via @portabletext/react (no XSS)"
    - "Semua input form divalidasi Zod"
    - "Sanity token publik hanya read-only"
    - "Rate limiting di form kontak & newsletter"

# ==========================================================================
# 10. RISK REGISTRY (from PRD §14)
# ==========================================================================
risks:
  - risk: "Data 25 kelompok belum tersedia"
    likelihood: high
    mitigation: "Gunakan AI-generated data realistis (GENERATORS.md)"

  - risk: "Logo & foto real kosong"
    likelihood: high
    mitigation: "Placeholder dengan deskripsi tekstual detail untuk DALL-E/Midjourney"

  - risk: "Domain belum ada"
    likelihood: medium
    mitigation: "Deploy ke Vercel subdomain dulu (bulawngandung.vercel.app)"

  - risk: "Admin tidak familiar Sanity Studio"
    likelihood: medium
    mitigation: "Generate panduan admin sederhana dalam documentation"

  - risk: "Konten multilingual kosong"
    likelihood: medium
    mitigation: "Isi ID dulu, locale lain generate dengan AI translation"

  - risk: "Vercel Hobby tier limit"
    likelihood: low
    mitigation: "Monitor bandwidth usage"

# ==========================================================================
# 11. AUTOPILOT CONFIGURATION
# ==========================================================================
autopilot:
  enabled: true
  silent_mode: true
  max_phases_auto: 19
  checkpoint_interval_min: 10
  max_phase_duration_min: 60

  auto_actions:
    - prd_parse
    - issue_generate
    - content_generate
    - code_generate
    - test_generate
    - doc_generate
    - self_heal

  forbidden:
    - git_push
    - git_force_push
    - env_modify
    - credential_access
    - external_api_call

  escalation:
    max_auto_retries: 3
    final_escalation: user

# ==========================================================================
# 12. WORKFLOW DIRECTORY STRUCTURE
# ==========================================================================
workflow_dirs:
  root: ".workflow/"
  issues: ".workflow/issues/"
  logs: ".workflow/logs/"
  experience: ".workflow/experience/"
  archive: ".workflow/logs/archive/"

  naming:
    issues: "fase-{XX}-{nama-fase}/WI-{XXX}-{slug-deskriptif}.md"
    logs_archive: "{YYYY-MM-DD}-{HHMM}-{nama}.log.gz"

  isolation:
    rule: "ALL workflow artifacts in .workflow/. NONE in project root."
    gitignore: ".workflow/"

# ==========================================================================
# 13. LOGGING CONFIGURATION
# ==========================================================================
logging:
  enabled: true
  principle: "NO LOG = NO ACTION"
  format: "JSONL"
  directory: ".workflow/logs/"

  log_files:
    pipeline:
      file: "pipeline.log"
      events: [phase_start, phase_complete, phase_fail, gate_check]
      estimated_entries_per_run: 60

    chain:
      file: "chain.log"
      events: [issue_start, step, file_create, file_edit, dep_install, gate_run, issue_complete, issue_blocked]
      estimated_entries_per_run: 2500

    errors:
      file: "errors.log"
      events: [error_detect, auto_fix_start, retry, retry_success, retry_fail, escalate]
      estimated_entries_per_run: 15

    delegation:
      file: "delegation.log"
      events: [agent_invoke, agent_start, agent_done, agent_fail]
      estimated_entries_per_run: 200

    design_critique:
      file: "design-critique.log"
      events: [sense_evaluate, ritual_step]
      estimated_entries_per_run: 315

    performance:
      file: "performance.log"
      events: [step_duration, gate_duration, issue_duration, phase_duration]
      estimated_entries_per_run: 3000

  summary:
    file: "summary.md"
    format: "Markdown"
    generate_after: [phase_complete, pipeline_complete]
    sections:
      - overall_stats
      - phase_timeline
      - error_log
      - design_critique_highlights
      - delegation_summary

  levels:
    DEBUG:
      description: "Step detail — file created, dep installed, line count, ritual step"
      log_to: [chain, performance]
    INFO:
      description: "Normal event — phase/issue start/done, gate pass, delegation"
      log_to: [pipeline, chain, delegation, design_critique]
    WARN:
      description: "Non-blocking — design revise, perf near threshold, chain blocked"
      log_to: [chain, design_critique, errors]
    ERROR:
      description: "Failure — gate fail, bug, chain break, escalation"
      log_to: [errors, chain]

  retention:
    max_archive_runs: 10
    compression: "gzip"
    auto_cleanup: true

  privacy:
    forbidden_in_log:
      - api_keys
      - tokens
      - secrets
      - user_data
      - credentials
      - absolute_local_paths

# ==========================================================================
# 14. EXPERIENCE LEARNING CONFIGURATION
# ==========================================================================
experience:
  enabled: true
  principle: "Every run teaches. Every log is a lesson."
  directory: ".workflow/experience/"

  files:
    patterns_learned:
      file: "patterns-learned.json"
      stores: [{pattern, domain, success_rate, insight, runs_validated}]
    timing_benchmarks:
      file: "timing-benchmarks.json"
      stores: [{phase, estimated_min, actual_avg_min, variance, bottleneck, insight}]
    error_taxonomy:
      file: "error-taxonomy.json"
      stores: [{type, frequency, phases, fix_strategy_best, prevention, insight}]
    design_preferences:
      file: "design-preferences.json"
      stores: [{color, typography, layout_preferences with confidence score}]
    agent_performance:
      file: "agent-performance.json"
      stores: [{agent, success_rate, avg_time, best_at, weak_at, insight}]
    improvement_metrics:
      file: "improvement-metrics.json"
      stores: [{run, errors, duration, design_pass_rate, auto_resolve_rate}]
    strategy_effectiveness:
      file: "strategy-effectiveness.json"
      stores: [{strategy, domain, success_rate, avg_resolution_time}]
    knowledge_graph:
      file: "knowledge-graph.json"
      stores: [{nodes, edges, inferences}]

  learning_loop:
    trigger: "pipeline_run_complete"
    steps:
      - analyze_logs
      - extract_patterns
      - update_benchmarks
      - classify_errors
      - update_preferences
      - reevaluate_agents
      - recalculate_metrics
      - generate_pre_run_brief

  pre_run_brief:
    enabled: true
    content:
      - predicted_errors
      - recommended_strategies
      - optimal_delegation
      - adjusted_estimates
      - confidence_scores
      - improvement_projection

  improvement_targets:
    error_reduction_per_run: "10%+"
    time_reduction_per_run: "3%+"
    design_quality_increase_per_run: "2%+"
    convergence_expected_at: "run ~8"

# ==========================================================================
# 15. PROJECT CONTEXT (from PRD)
# ==========================================================================
project:
  name: "Website Koperasi Perhutanan Sosial Bulau Ngandung"
  short_name: "Bulau Ngandung"
  type: "website_informatif_publik"
  framework: "Next.js 15 (App Router)"
  language: "TypeScript 5.x"
  styling: "Tailwind CSS 4.x + shadcn/ui"
  cms: "Sanity.io"
