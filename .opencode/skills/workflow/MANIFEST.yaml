# MANIFEST: Workflow Configuration
# PRD-to-Production Pipeline Orchestrator

metadata:
  version: "1.0.0"
  codename: "pipeline"
  autonomy: full
  compatibility: opencode>=1.0.0

# ==========================================================================
# 1. AGENT REGISTRY (for orchestrator integration)
# ==========================================================================
agent:
  id: "pw"
  name: "PipelineWorkflow"
  type: "meta-orchestrator"
  priority: 11  # Highest — takes control when PRD.md detected
  activation: "on_prd_detected"
  capabilities:
    - prd_parsing
    - issue_generation
    - chain_execution
    - content_generation
    - design_critique
    - delegate_to_skills
    - track_definition_of_done
    - milestone_reporting
  permissions:
    - read_all_files
    - write_project_files
    - delegate_to_agents
    - modify_shared_state
    - escalate_to_user
  integrations:
    delegates_to:
      - agent: apw
        skill: apple-parallax-web
        for: [design_ui, components, pages, animations]
      - agent: so
        skill: seo-optimizer
        for: [seo, structured_data, meta_tags, sitemap]
      - agent: bc
        orchestrator: BugChecker
        for: [quality_scan, lint, security, accessibility]
      - agent: ud
        orchestrator: Understanding
        for: [architecture_validation, gap_analysis]
      - agent: aw
        orchestrator: Awareness
        for: [file_tracking, conflict_detection, progress_monitoring]
      - agent: ap
        orchestrator: Adaptation
        for: [strategy_fallback, error_recovery]

# ==========================================================================
# 2. PRD PARSER CONFIGURATION
# ==========================================================================
prd_parser:
  source_file: "PRD.md"
  extraction_rules:
    tech_stack: "§5.1"
    dependencies: "§5.2"
    sitemap: "§3.1"
    pages: "§3.2"
    storytelling: "§4"
    sanity_schemas: "§5.4"
    i18n_config: "§5.5"
    rendering_strategy: "§5.6"
    design_tokens: "§6"
    security: "§7"
    newsletter: "§8"
    seo: "§9"
    analytics: "§10"
    non_functional: "§11"
    folder_structure: "§12"
    milestones: "§13"
    risks: "§14"
    definition_of_done: "§15"

  output_files:
    context_json: ".workflow/context.json"
    todos_json: ".workflow/todos.json"
    issues_dir: ".workflow/issues/"

# ==========================================================================
# 3. PHASE CONFIGURATION (19 Phases)
# ==========================================================================
phases:
  "-2":
    name: "PRD Analysis & Enrichment"
    issues: ["WI-001", "WI-005"]
    gate: prd_scorecard
    min_duration_min: 5
    max_duration_min: 15

  "-1":
    name: "Local Issue Generation"
    issues: ["WI-006", "WI-010"]
    gate: issue_count_validation
    min_issues_generated: 80
    max_issues_generated: 220
    issue_template: "ISSUE_SPEC.md"

  "0":
    name: "Architecture & Strategy"
    issues: ["WI-011", "WI-020"]
    gate: architecture_decision_records
    required_adrs: 8

  "1":
    name: "Foundation & Developer Experience"
    issues: ["WI-021", "WI-030"]
    gate: dev_server_running
    required_command: "npm run dev"
    required_files:
      - "package.json"
      - "next.config.ts"
      - "tailwind.config.ts"
      - "i18n.config.ts"
      - "middleware.ts"

  "2":
    name: "Design System Factory"
    issues: ["WI-031", "WI-050"]
    gate: design_system_complete
    required_files:
      - "components/ui/*.tsx"  # 15 components
    required_tokens:
      - "--primary"
      - "--secondary"
      - "--accent"
      - "--background"
      - "--foreground"

  "3":
    name: "Content Architecture & AI Generation"
    issues: ["WI-051", "WI-065"]
    gate: content_generated
    required_content:
      member_profiles: 25
      product_stories: 15
      storytelling_narratives: 8
      locales: ["id", "en", "zh", "ja"]

  "4":
    name: "Layout & Navigation"
    issues: ["WI-066", "WI-075"]
    gate: layout_renders
    required_files:
      - "components/layout/Navbar.tsx"
      - "components/layout/Footer.tsx"
      - "components/layout/LanguageSwitcher.tsx"

  "5":
    name: "Component Library"
    issues: ["WI-076", "WI-100"]
    gate: all_components_built
    required_components: 15

  "6":
    name: "Pages"
    issues: ["WI-101", "WI-115"]
    gate: all_pages_accessible
    required_pages: 13

  "7":
    name: "Forms & Integrations"
    issues: ["WI-116", "WI-125"]
    gate: forms_functional
    required_apis:
      - "/api/newsletter"
      - "/api/contact"
      - "/api/revalidate"

  "8":
    name: "Content Strategy Layer"
    issues: ["WI-126", "WI-135"]
    gate: content_strategy_ready

  "9":
    name: "Quality Engineering"
    issues: ["WI-136", "WI-145"]
    gate: quality_passing
    min_test_coverage: 80
    min_typescript_coverage: 95

  "10":
    name: "Performance Engineering"
    issues: ["WI-146", "WI-155"]
    gate: performance_budget_met
    thresholds:
      lcp_ms: 2500
      cls: 0.1
      inp_ms: 200

  "11":
    name: "SEO Engineering"
    issues: ["WI-156", "WI-165"]
    gate: seo_audit_pass
    delegate_to: "seo-optimizer"
    min_lighthouse_seo: 90

  "12":
    name: "Security Engineering"
    issues: ["WI-166", "WI-172"]
    gate: security_headers_active
    required_headers:
      - "Content-Security-Policy"
      - "X-Frame-Options"
      - "X-Content-Type-Options"

  "13":
    name: "Platform Engineering"
    issues: ["WI-173", "WI-182"]
    gate: infrastructure_ready
    required_files:
      - "Dockerfile"
      - "k6/load-test.js"
      - "vercel.json"

  "14":
    name: "CI/CD & DevOps"
    issues: ["WI-183", "WI-192"]
    gate: ci_pipeline_green
    required_files:
      - ".github/workflows/ci.yml"
      - ".github/workflows/preview.yml"
      - ".github/workflows/production.yml"

  "15":
    name: "Observability"
    issues: ["WI-193", "WI-200"]
    gate: monitoring_configured

  "16":
    name: "Documentation"
    issues: ["WI-201", "WI-210"]
    gate: docs_complete
    required_docs:
      - "ARCHITECTURE.md"
      - "DEPLOYMENT.md"
      - "COMPONENTS.md"

  "17":
    name: "Launch & Handover"
    issues: ["WI-211", "WI-220"]
    gate: launch_checklist_complete
    required_checklist_items: 50

# ==========================================================================
# 4. QUALITY GATE THRESHOLDS
# ==========================================================================
gates:
  default:
    lint:
      command: "npx eslint . --max-warnings 0"
      expected: "0 errors, 0 warnings"
      auto_fix: true

    typecheck:
      command: "npx tsc --noEmit"
      expected: "0 errors"
      auto_fix: false

    format:
      command: "npx prettier --check ."
      expected: "0 issues"
      auto_fix: true

    build:
      command: "npm run build"
      expected: "Success"
      auto_fix: false

    test:
      command: "npx vitest run"
      expected: "All pass"
      auto_fix: false
      min_coverage: 80

    accessibility:
      command: "npx @axe-core/cli http://localhost:3000"
      expected: "0 violations"
      auto_fix: false

    performance:
      tool: "Lighthouse"
      thresholds:
        performance: 90
        accessibility: 95
        best_practices: 90
        seo: 90

    bundle_size:
      command: "npx next-bundle-analyzer"
      max_first_load_js_kb: 200
      max_first_load_css_kb: 50

  design_sense:
    min_pass: 5          # Minimum 5 of 7 sensibilities must PASS
    mandatory_pass: 6    # Sense #6 (Kesadaran Konteks) is MANDATORY
    max_revise: 2        # Maximum 2 REVISE allowed per issue
    auto_revise_loop: 3  # Max auto-revision cycles before escalation

  chain:
    max_retry_per_issue: 3
    max_breaks_per_phase: 2
    max_parallel_issues: 3
    stall_timeout_min: 10

# ==========================================================================
# 5. DESIGN TOKEN MAPPING
# ==========================================================================
design_tokens:
  colors:
    primary:    { hex: "#2D6A4F", hsl: "160 43% 28%", name: "forest-depth" }
    secondary:  { hex: "#8B6F47", hsl: "35 25% 42%", name: "earth-anchor" }
    accent:     { hex: "#D4A373", hsl: "30 48% 64%", name: "honey-glow" }
    background: { hex: "#FAF9F6", hsl: "40 33% 98%", name: "morning-mist" }
    foreground: { hex: "#1B4332", hsl: "160 30% 15%", name: "forest-depth-dark" }
    muted:      { hex: "#6B7280", hsl: "220 14% 54%", name: "silence-weight" }
    border:     { hex: "#E5E7EB", hsl: "220 13% 91%", name: "visual-whisper" }

  typography:
    font_family: "Inter, Geist, sans-serif"
    scale:
      hero:    "clamp(2.5rem, 5vw, 4.5rem)"
      h2:      "clamp(2rem, 4vw, 2.5rem)"
      h3:      "clamp(1.25rem, 2vw, 1.5rem)"
      body:    "clamp(1rem, 1.5vw, 1.125rem)"
      caption: "clamp(0.75rem, 1vw, 0.875rem)"

  spacing:
    grid: 4    # 4px base grid
    scale: [4, 8, 12, 16, 20, 24, 32, 40, 48, 64, 80, 96, 128]

  animation:
    default_duration: 0.6
    default_easing: "power3.out"
    reduced_motion: true   # Always respect prefers-reduced-motion

# ==========================================================================
# 6. DEPENDENCY REGISTRY (33 packages)
# ==========================================================================
dependencies:
